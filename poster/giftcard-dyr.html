<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Do You Remember Gift Card</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--navy:#020b26;--gold1:#fff3b0;--gold2:#f5c542;--gold3:#b9811c;--gold4:#6b4708}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:"Exo 2",sans-serif;color:#fff}
.card{position:relative;overflow:hidden;width:1700px;height:1000px;border-radius:44px;
  background:radial-gradient(ellipse 60% 70% at 28% 55%,rgba(40,130,255,.55),transparent 70%),radial-gradient(ellipse 90% 90% at 50% 30%,#0c3a9a 0%,#062263 50%,var(--navy) 90%)}
.frame{position:absolute;inset:22px;border-radius:30px;border:6px solid var(--gold2);box-shadow:0 0 30px rgba(245,197,66,.55),inset 0 0 30px rgba(245,197,66,.35)}
.frame2{position:absolute;inset:40px;border-radius:22px;border:2px solid rgba(255,243,176,.55)}
.grid{position:absolute;left:-10%;right:-10%;bottom:-8%;height:38%;perspective:600px}
.grid i{position:absolute;inset:0;transform:rotateX(68deg);transform-origin:50% 0;background-image:linear-gradient(rgba(70,170,255,.4) 2px,transparent 2px),linear-gradient(90deg,rgba(70,170,255,.4) 2px,transparent 2px);background-size:70px 70px;-webkit-mask-image:linear-gradient(transparent,#000 35%)}
.streak{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(120,200,255,.95),#fff,rgba(120,200,255,.9),transparent);box-shadow:0 0 18px 4px rgba(60,160,255,.55);opacity:.8}
.left{position:absolute;left:90px;top:120px;width:560px;height:760px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,90,.55),rgba(255,190,60,.15) 50%,transparent 70%);top:60px}
.trophy{position:relative;width:440px;height:503px}
.badges{position:relative;display:flex;gap:14px;margin-top:22px}
.badges svg{width:96px;height:96px}
.right{position:absolute;left:690px;right:90px;top:90px;bottom:90px;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{display:flex;align-items:center;gap:18px}
.brand img{height:70px;border-radius:12px;box-shadow:0 0 18px rgba(120,190,255,.7)}
.brand span{font-family:"Russo One";font-size:36px;letter-spacing:1px}
.sub{margin-top:8px;font-family:"Exo 2";font-weight:800;font-size:26px;letter-spacing:6px;color:#cfe6ff}
.plate{margin-top:34px;padding:10px 54px;font-family:"Orbitron";font-weight:900;font-size:40px;letter-spacing:10px;color:#3a2400;border-radius:999px;background:linear-gradient(180deg,var(--gold1),var(--gold2) 45%,var(--gold3));box-shadow:0 6px 0 var(--gold4),0 10px 24px rgba(0,0,0,.5)}
.big{margin-top:30px;font-family:"Orbitron";font-weight:900;font-size:118px;line-height:1;white-space:nowrap}
.chrome,.goldtxt{-webkit-background-clip:text;background-clip:text;color:transparent}
.chrome{background-image:linear-gradient(180deg,#fff 0%,#e3f0ff 35%,#7fb2f0 50%,#2f6fd0 56%,#bfdcff 75%,#fff 100%);-webkit-text-stroke:2px rgba(255,255,255,.55);filter:drop-shadow(0 4px 0 #062a75) drop-shadow(0 8px 12px rgba(0,0,0,.7)) drop-shadow(0 0 22px rgba(60,160,255,.55))}
.goldtxt{background-image:linear-gradient(180deg,#fffbe0 0%,#ffe07a 35%,#e0a52a 52%,#9a6a12 58%,#f5c542 78%,#fff3b0 100%);-webkit-text-stroke:2px rgba(255,240,180,.6);filter:drop-shadow(0 4px 0 #5a3a05) drop-shadow(0 8px 12px rgba(0,0,0,.7)) drop-shadow(0 0 20px rgba(255,190,60,.45))}
.dyr{font-size:92px;margin-top:14px}.dyr+.dyr{margin-top:4px}.win{font-size:74px;margin-top:22px}.no1{font-size:170px;margin-top:6px}
.champ{margin-top:18px;font-family:"Exo 2";font-weight:800;font-style:italic;font-size:40px;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.6)}
.to{margin-top:auto;width:100%;display:flex;align-items:flex-end;gap:18px;font-family:"Exo 2";font-weight:800;font-size:30px;color:#cfe6ff}
.to .line{flex:1;border-bottom:3px dashed rgba(255,243,176,.8);height:40px}
.foot{margin-top:26px;font-family:"Exo 2";font-weight:600;font-size:24px;letter-spacing:2px;color:#9fc4f5}
.foot b{color:var(--gold2)}
.sp{position:absolute;width:40px;height:40px;filter:drop-shadow(0 0 8px #fff)}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c4"/><stop offset=".35" stop-color="#ffd54a"/><stop offset=".6" stop-color="#d99a1e"/><stop offset="1" stop-color="#8a5a0c"/></linearGradient>
    <linearGradient id="gGoldH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a86f12"/><stop offset=".45" stop-color="#ffe27a"/><stop offset="1" stop-color="#b37816"/></linearGradient>
    <linearGradient id="gSilver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c9d8ee"/><stop offset=".55" stop-color="#7f97ba"/><stop offset="1" stop-color="#e9f1ff"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6ff7a"/><stop offset=".5" stop-color="#34c24a"/><stop offset="1" stop-color="#0f6b2a"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a8a"/><stop offset=".45" stop-color="#ef2b2b"/><stop offset="1" stop-color="#8f0d16"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fdcff"/><stop offset=".5" stop-color="#2f86f0"/><stop offset="1" stop-color="#0b3a99"/></linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3b8ff"/><stop offset=".5" stop-color="#9b4dff"/><stop offset="1" stop-color="#4b1597"/></linearGradient>
    <linearGradient id="gRope" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6a8"/><stop offset=".5" stop-color="#d9a14b"/><stop offset="1" stop-color="#7a4a14"/></linearGradient>
    <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe3ff"/><stop offset="1" stop-color="#0a5fc4"/></linearGradient>
    <radialGradient id="gShine" cx=".35" cy=".25" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="fDrop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="pCheck" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fff"/><rect width="8" height="8" fill="#111"/><rect x="8" y="8" width="8" height="8" fill="#111"/></pattern>
  </defs>

  <!-- Snake & Ladder: gold ladder with a green snake wrapped round it, and a die -->
  <symbol id="iSnake" viewBox="0 0 200 200">
    <g filter="url(#fDrop)">
      <g transform="rotate(-18 100 100)">
        <rect x="58" y="22" width="13" height="156" rx="6" fill="url(#gGoldH)" stroke="#6b4708" stroke-width="2"/>
        <rect x="118" y="22" width="13" height="156" rx="6" fill="url(#gGoldH)" stroke="#6b4708" stroke-width="2"/>
        <g fill="url(#gGold)" stroke="#6b4708" stroke-width="2">
          <rect x="66" y="40" width="58" height="10" rx="4"/><rect x="66" y="72" width="58" height="10" rx="4"/>
          <rect x="66" y="104" width="58" height="10" rx="4"/><rect x="66" y="136" width="58" height="10" rx="4"/>
        </g>
      </g>
      <path d="M34 160 C 70 175, 150 150, 120 118 S 40 96, 70 70 S 150 52, 150 36" fill="none" stroke="#0b4a1d" stroke-width="24" stroke-linecap="round"/>
      <path d="M34 160 C 70 175, 150 150, 120 118 S 40 96, 70 70 S 150 52, 150 36" fill="none" stroke="url(#gGreen)" stroke-width="19" stroke-linecap="round"/>
      <path d="M34 160 C 70 175, 150 150, 120 118 S 40 96, 70 70 S 150 52, 150 36" fill="none" stroke="#e6ff9a" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12" opacity=".9"/>
      <ellipse cx="156" cy="32" rx="20" ry="15" fill="url(#gGreen)" stroke="#0b4a1d" stroke-width="3"/>
      <circle cx="150" cy="27" r="4.5" fill="#fff"/><circle cx="151" cy="27" r="2.3" fill="#111"/>
      <circle cx="163" cy="26" r="4.5" fill="#fff"/><circle cx="164" cy="26" r="2.3" fill="#111"/>
      <path d="M172 38 l12 4 m-12 -4 l10 10" stroke="#ff3b4e" stroke-width="3" stroke-linecap="round"/>
      <g transform="translate(140 132) rotate(14)">
        <rect x="0" y="0" width="44" height="44" rx="9" fill="url(#gSilver)" stroke="#33507a" stroke-width="2.5"/>
        <circle cx="11" cy="11" r="4.5" fill="#d1182b"/><circle cx="33" cy="33" r="4.5" fill="#d1182b"/><circle cx="22" cy="22" r="4.5" fill="#d1182b"/>
        <circle cx="33" cy="11" r="4.5" fill="#d1182b"/><circle cx="11" cy="33" r="4.5" fill="#d1182b"/>
      </g>
    </g>
  </symbol>

  <!-- Quality Cart: red race kart with checkered flag and speed lines -->
  <symbol id="iKart" viewBox="0 0 200 200">

      <path d="M94 92 Q 102 82 116 82" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>
      <rect x="40" y="104" width="12" height="34" rx="3" fill="#1b1b1b"/><rect x="30" y="100" width="30" height="8" rx="3" fill="url(#gRed)" stroke="#5a0710" stroke-width="2"/>
      <rect x="98" y="112" width="40" height="22" rx="5" fill="#fff"/><text x="118" y="129" text-anchor="middle" font-family="Orbitron" font-weight="900" font-size="18" fill="#c1121f">Q1</text>
      <g><circle cx="74" cy="154" r="20" fill="#1a1a1a" stroke="#000" stroke-width="2"/><circle cx="74" cy="154" r="9" fill="url(#gSilver)"/></g>
      <g><circle cx="152" cy="154" r="20" fill="#1a1a1a" stroke="#000" stroke-width="2"/><circle cx="152" cy="154" r="9" fill="url(#gSilver)"/></g>
      <path d="M62 116 Q 70 104 90 102" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".55"/>
    </g>
  </symbol>

  <!-- Quality Clash: crossed swords over a shield with a monster face -->
  <symbol id="iClash" viewBox="0 0 200 200">
    <g filter="url(#fDrop)">
      <g transform="rotate(40 100 100)">
        <rect x="94" y="8" width="12" height="130" rx="3" fill="url(#gSilver)" stroke="#33507a" stroke-width="2"/>
        <path d="M94 8 L100 -6 L106 8 Z" fill="url(#gSilver)" stroke="#33507a" stroke-width="2"/>
        <rect x="76" y="136" width="48" height="10" rx="4" fill="url(#gGold)" stroke="#6b4708" stroke-width="2"/>
        <rect x="95" y="146" width="10" height="34" rx="3" fill="#5a2d0c"/><circle cx="100" cy="184" r="7" fill="url(#gGold)" stroke="#6b4708" stroke-width="2"/>
      </g>
      <g transform="rotate(-40 100 100)">
        <rect x="94" y="8" width="12" height="130" rx="3" fill="url(#gSilver)" stroke="#33507a" stroke-width="2"/>
        <path d="M94 8 L100 -6 L106 8 Z" fill="url(#gSilver)" stroke="#33507a" stroke-width="2"/>
        <rect x="76" y="136" width="48" height="10" rx="4" fill="url(#gGold)" stroke="#6b4708" stroke-width="2"/>
        <rect x="95" y="146" width="10" height="34" rx="3" fill="#5a2d0c"/><circle cx="100" cy="184" r="7" fill="url(#gGold)" stroke="#6b4708" stroke-width="2"/>
      </g>
      <path d="M100 42 L 152 58 Q 154 120 100 160 Q 46 120 48 58 Z" fill="url(#gGold)" stroke="#6b4708" stroke-width="3"/>
      <path d="M100 54 L 141 66 Q 142 114 100 146 Q 58 114 59 66 Z" fill="url(#gPurple)" stroke="#2b0a5a" stroke-width="2"/>

  </symbol>

  <!-- Fishing Derby: golden fish leaping from the water on a hook line -->
  <symbol id="iFish" viewBox="0 0 200 200">
    <g filter="url(#fDrop)">
      <path d="M150 6 Q 156 50 132 70" stroke="#e8f2ff" stroke-width="2.5" fill="none"/>
      <path d="M20 150 Q 50 136 80 150 T 140 150 T 190 148 L 190 190 L 20 190 Z" fill="url(#gWater)" stroke="#0b3a99" stroke-width="3"/>
      <path d="M30 160 Q 56 150 80 160" stroke="#bff0ff" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g fill="#bff0ff"><circle cx="60" cy="132" r="6"/><circle cx="44" cy="120" r="4"/><circle cx="150" cy="128" r="5"/><circle cx="166" cy="116" r="3.5"/></g>
      <g transform="rotate(-28 100 100)">
        <path d="M44 104 Q 80 56 132 84 Q 150 94 160 104 Q 150 114 132 124 Q 80 152 44 104 Z" fill="url(#gGold)" stroke="#6b4708" stroke-width="3"/>
        <path d="M44 104 L 14 78 Q 24 104 14 130 Z" fill="url(#gGold)" stroke="#6b4708" stroke-width="3"/>
        <path d="M84 80 Q 96 60 116 74 Q 104 78 96 88 Z" fill="url(#gGoldH)" stroke="#6b4708" stroke-width="2"/>
        <path d="M84 118 Q 100 112 110 120" stroke="#6b4708" stroke-width="2.5" fill="none"/>
        <path d="M70 104 Q 80 92 92 104 Q 80 116 70 104 Z M96 104 Q 106 92 118 104 Q 106 116 96 104 Z" fill="#ffe680" opacity=".8"/>
        <circle cx="140" cy="98" r="7" fill="#fff" stroke="#6b4708" stroke-width="2"/><circle cx="142" cy="98" r="3.5" fill="#111"/>
        <path d="M60 96 Q 80 80 108 84" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>

      <path d="M132 70 q 6 10 -2 14" stroke="url(#gSilver)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g fill="#fff" filter="url(#fGlow)"><path d="M168 40 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z"/><path d="M40 52 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z"/></g>
    </g>
  </symbol>

  <!-- Pull the Rope: thick rope, red and blue ends, centre flag and a splash -->
  <symbol id="iRope" viewBox="0 0 200 200">
    <g filter="url(#fDrop)">
      <path d="M74 150 Q 100 134 126 150 L 126 176 L 74 176 Z" fill="url(#gWater)" stroke="#0b3a99" stroke-width="3"/>
      <g fill="#bff0ff"><circle cx="86" cy="134" r="5"/><circle cx="112" cy="128" r="6"/><circle cx="100" cy="118" r="4"/></g>
      <path d="M14 112 Q 100 80 186 112" stroke="#5a3a0c" stroke-width="22" fill="none" stroke-linecap="round"/>

      <g transform="translate(14 112)"><circle r="20" fill="url(#gRed)" stroke="#5a0710" stroke-width="3"/><path d="M-8 -6 h16 M-8 0 h16 M-8 6 h16" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/></g>
      <g transform="translate(186 112)"><circle r="20" fill="url(#gBlue)" stroke="#0b2a66" stroke-width="3"/><path d="M-8 -6 h16 M-8 0 h16 M-8 6 h16" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/></g>
      <rect x="97" y="40" width="6" height="58" rx="2" fill="url(#gSilver)" stroke="#33507a" stroke-width="1.5"/>
      <path d="M103 42 Q 130 36 150 48 Q 130 58 103 64 Z" fill="url(#gGold)" stroke="#6b4708" stroke-width="2.5"/>
      <circle cx="100" cy="38" r="6" fill="url(#gGold)" stroke="#6b4708" stroke-width="2"/>
      <path d="M40 46 l12 -6 M50 62 l14 -2 M160 64 l-14 -2 M150 76 l-12 -4" stroke="#ffd54a" stroke-width="4" stroke-linecap="round"/>
    </g>
  </symbol>

  <!-- gift box: colours come from CSS variables on the <use> -->
  <symbol id="iGift" viewBox="0 0 120 120">
    <g filter="url(#fDrop)">
      <rect x="10" y="50" width="100" height="64" rx="6" fill="var(--box1)" stroke="var(--box3)" stroke-width="3"/>
      <rect x="10" y="50" width="100" height="64" rx="6" fill="url(#gShine)" opacity=".55"/>
      <rect x="4" y="34" width="112" height="22" rx="5" fill="var(--box2)" stroke="var(--box3)" stroke-width="3"/>
      <rect x="50" y="34" width="20" height="80" fill="url(#gGoldH)" stroke="#6b4708" stroke-width="2"/>

      <path d="M18 60 h18" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>

  </symbol>
  <symbol id="iTrophy" viewBox="0 0 140 160">
    <g filter="url(#fDrop)">

      <path d="M110 24 C 136 24, 136 64, 100 70" fill="none" stroke="url(#gGoldH)" stroke-width="9" stroke-linecap="round"/>
      <path d="M28 12 H 112 Q 112 82 70 96 Q 28 82 28 12 Z" fill="url(#gGold)" stroke="#6b4708" stroke-width="3"/>
      <path d="M40 20 Q 42 66 64 84" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".6"/>
      <rect x="60" y="94" width="20" height="22" fill="url(#gGoldH)" stroke="#6b4708" stroke-width="2.5"/>
      <rect x="36" y="114" width="68" height="14" rx="4" fill="url(#gGold)" stroke="#6b4708" stroke-width="2.5"/>
      <rect x="26" y="126" width="88" height="24" rx="5" fill="#0b2e78" stroke="var(--gold2)" stroke-width="3"/>
      <path d="M70 30 l6 13 l14 2 l-10 10 l3 14 l-13 -7 l-13 7 l3 -14 l-10 -10 l14 -2 Z" fill="#fff6c4" stroke="#b9811c" stroke-width="2"/>
      <text x="70" y="144" text-anchor="middle" font-family="Orbitron" font-weight="900" font-size="15" fill="#ffd76a">No.1</text>
    </g>
  </symbol>
  <!-- Quality Spin: the prize wheel with a gold pointer -->
  <symbol id="iSpin" viewBox="0 0 200 200">
    <g filter="url(#fDrop)">
      <circle cx="100" cy="108" r="76" fill="url(#gGold)" stroke="#6b4708" stroke-width="3"/>
      <g transform="translate(100 108)">
        <path d="M0 0 L0 -66 A66 66 0 0 1 46.7 -46.7 Z" fill="#e3263a"/>
        <path d="M0 0 L46.7 -46.7 A66 66 0 0 1 66 0 Z" fill="#1d7bf0"/>

        <path d="M0 0 L46.7 46.7 A66 66 0 0 1 0 66 Z" fill="#7c3aed"/>
        <path d="M0 0 L0 66 A66 66 0 0 1 -46.7 46.7 Z" fill="#e8a317"/>
        <path d="M0 0 L-46.7 46.7 A66 66 0 0 1 -66 0 Z" fill="#c1121f"/>
        <path d="M0 0 L-66 0 A66 66 0 0 1 -46.7 -46.7 Z" fill="#0a8a5a"/>
        <path d="M0 0 L-46.7 -46.7 A66 66 0 0 1 0 -66 Z" fill="#1d7bf0"/>
        <g stroke="#fff" stroke-width="2" opacity=".85"><path d="M0 -66V66M-66 0H66M-46.7 -46.7L46.7 46.7M46.7 -46.7L-46.7 46.7"/></g>
        <circle r="66" fill="url(#gShine)" opacity=".35"/>
        <circle r="16" fill="url(#gGold)" stroke="#6b4708" stroke-width="3"/>
        <text y="6" text-anchor="middle" font-family="Orbitron" font-weight="900" font-size="15" fill="#3a2400">Q</text>
      </g>
      <g fill="#fff8d6"><circle cx="100" cy="36" r="3"/><circle cx="166" cy="72" r="3"/><circle cx="166" cy="144" r="3"/><circle cx="100" cy="180" r="3"/><circle cx="34" cy="144" r="3"/><circle cx="34" cy="72" r="3"/></g>
      <path d="M86 18 H114 L100 46 Z" fill="url(#gGold)" stroke="#6b4708" stroke-width="3" stroke-linejoin="round"/>
